<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Analyzer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'SF Mono', 'Fira Code', monospace;
    min-height: 100vh;
    padding: 16px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .header h1 {
    font-size: 14px;
    font-weight: 600;
    color: #888;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  input {
    flex: 1;
    background: #13131a;
    border: 1px solid #222;
    border-radius: 6px;
    padding: 10px 14px;
    color: #e0e0e0;
    font-family: 'SF Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: #444; }
  input::placeholder { color: #444; }

  button {
    background: #1a1a2e;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px 18px;
    color: #e0e0e0;
    font-family: 'SF Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  button:hover { background: #222236; border-color: #555; }
  button.active { background: #22c55e20; border-color: #22c55e; color: #22c55e; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  .stat-card {
    background: #13131a;
    border: 1px solid #1e1e2e;
    border-radius: 6px;
    padding: 12px;
  }

  .stat-label {
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 16px;
    font-weight: 600;
    color: #e0e0e0;
  }

  .stat-value.up { color: #22c55e; }
  .stat-value.down { color: #ef4444; }

  .chart-container {
    background: #13131a;
    border: 1px solid #1e1e2e;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    position: relative;
  }

  canvas {
    width: 100%;
    display: block;
  }

  .signal-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }

  .signal-card {
    background: #13131a;
    border: 1px solid #1e1e2e;
    border-radius: 8px;
    padding: 14px;
  }

  .signal-title {
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  .trend-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .trend-up { background: #22c55e20; color: #22c55e; border: 1px solid #22c55e40; }
  .trend-down { background: #ef444420; color: #ef4444; border: 1px solid #ef444440; }
  .trend-range { background: #f59e0b20; color: #f59e0b; border: 1px solid #f59e0b40; }

  .entry-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #1e1e2e;
    font-size: 12px;
  }

  .entry-item:last-child { border-bottom: none; }
  .entry-label { color: #666; }
  .entry-value { color: #e0e0e0; font-weight: 600; }
  .entry-value.buy { color: #22c55e; }
  .entry-value.sell { color: #ef4444; }

  .update-time {
    font-size: 11px;
    color: #444;
    text-align: right;
    margin-top: 8px;
  }

  .error { color: #ef4444; font-size: 13px; padding: 12px; }
  .loading { color: #555; font-size: 13px; padding: 12px; }

  .vol-bar {
    height: 3px;
    background: #22c55e40;
    border-radius: 2px;
    margin-top: 4px;
  }

  .vol-fill {
    height: 100%;
    background: #22c55e;
    border-radius: 2px;
    transition: width 0.3s;
  }

  .timeframe-row {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }

  .tf-btn {
    padding: 4px 10px;
    font-size: 11px;
    background: #0a0a0f;
    border: 1px solid #222;
    border-radius: 4px;
    color: #555;
    cursor: pointer;
    transition: all 0.15s;
  }

  .tf-btn.active {
    background: #1a1a2e;
    border-color: #444;
    color: #e0e0e0;
  }

  .heat-card {
    background: #13131a;
    border: 1px solid #1e1e2e;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .heat-title { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .heat-score-row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .heat-score { font-size: 48px; font-weight: 700; line-height: 1; min-width: 80px; }
  .heat-label { font-size: 18px; font-weight: 600; }
  .heat-desc { font-size: 12px; color: #666; margin-top: 4px; }
  .heat-gauge { position: relative; height: 8px; background: #1e1e2e; border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .heat-gauge-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease, background 0.5s ease; }
  .heat-factors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .heat-factor { background: #0a0a0f; border-radius: 4px; padding: 8px; }
  .heat-factor-label { font-size: 10px; color: #555; margin-bottom: 4px; }
  .heat-factor-bar { height: 3px; background: #1e1e2e; border-radius: 2px; margin-bottom: 3px; overflow: hidden; }
  .heat-factor-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .heat-factor-val { font-size: 11px; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <div class="dot" id="liveDot"></div>
  <h1>Chart Analyzer</h1>
  <span style="color:#444;font-size:11px;margin-left:auto" id="updateLabel">—</span>
</div>

<div class="input-row">
  <input id="caInput" type="text" placeholder="CAを入力（例: xxxpump）" />
  <button onclick="loadToken()">分析</button>
  <button id="autoBtn" onclick="toggleAuto()">自動更新 OFF</button>
</div>

<div id="statsRow" class="stats-row" style="display:none">
  <div class="stat-card">
    <div class="stat-label">現在価格</div>
    <div class="stat-value" id="statPrice">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">5分変動</div>
    <div class="stat-value" id="statChange5">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">流動性</div>
    <div class="stat-value" id="statLiq">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">買い比率(5m)</div>
    <div class="stat-value" id="statBuyRatio">—</div>
  </div>
</div>

<div id="heatCard" class="heat-card" style="display:none">
  <div class="heat-title">過熱スコア</div>
  <div class="heat-score-row">
    <div class="heat-score" id="heatScore">—</div>
    <div>
      <div class="heat-label" id="heatLabel">—</div>
      <div class="heat-desc" id="heatDesc">—</div>
    </div>
  </div>
  <div class="heat-gauge">
    <div class="heat-gauge-fill" id="heatGaugeFill" style="width:0%"></div>
  </div>
  <div class="heat-factors">
    <div class="heat-factor">
      <div class="heat-factor-label">5m変動</div>
      <div class="heat-factor-bar"><div class="heat-factor-fill" id="hf1" style="width:0%"></div></div>
      <div class="heat-factor-val" id="hv1">—</div>
    </div>
    <div class="heat-factor">
      <div class="heat-factor-label">買い比率</div>
      <div class="heat-factor-bar"><div class="heat-factor-fill" id="hf2" style="width:0%"></div></div>
      <div class="heat-factor-val" id="hv2">—</div>
    </div>
    <div class="heat-factor">
      <div class="heat-factor-label">1h変動</div>
      <div class="heat-factor-bar"><div class="heat-factor-fill" id="hf3" style="width:0%"></div></div>
      <div class="heat-factor-val" id="hv3">—</div>
    </div>
  </div>
</div>

<div id="chartContainer" class="chart-container" style="display:none">
  <div class="timeframe-row">
    <button class="tf-btn active" onclick="setTf(1, this)">1m</button>
    <button class="tf-btn" onclick="setTf(5, this)">5m</button>
    <button class="tf-btn" onclick="setTf(15, this)">15m</button>
  </div>
  <canvas id="priceChart" height="200"></canvas>
  <canvas id="volChart" height="50" style="margin-top:4px"></canvas>
  <div class="update-time" id="updateTime">—</div>
</div>

<div id="signalRow" class="signal-row" style="display:none">
  <div class="signal-card">
    <div class="signal-title">トレンド判定</div>
    <div id="trendBadge" class="trend-badge">—</div>
    <div id="trendDesc" style="font-size:12px;color:#666;margin-top:4px">—</div>
  </div>
  <div class="signal-card">
    <div class="signal-title">エントリー目安</div>
    <div id="entryList">—</div>
  </div>
</div>

<div id="statusMsg" class="loading"></div>

<script>
let currentMint = '';
let ohlcvData = [];
let autoInterval = null;
let isAuto = false;
let currentTf = 1;
let priceCanvas, volCanvas, priceCtx, volCtx;

function setTf(tf, btn) {
  currentTf = tf;
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (currentMint) fetchOHLCV();
}

function toggleAuto() {
  isAuto = !isAuto;
  const btn = document.getElementById('autoBtn');
  if (isAuto) {
    btn.textContent = '自動更新 ON';
    btn.classList.add('active');
    autoInterval = setInterval(() => { if (currentMint) fetchAll(); }, 5000);
  } else {
    btn.textContent = '自動更新 OFF';
    btn.classList.remove('active');
    clearInterval(autoInterval);
  }
}

async function loadToken() {
  const ca = document.getElementById('caInput').value.trim();
  if (!ca) return;
  currentMint = ca;
  document.getElementById('statusMsg').textContent = '取得中...';
  await fetchAll();
}

async function fetchAll() {
  await Promise.all([fetchTokenInfo(), fetchOHLCV()]);
}

async function fetchTokenInfo() {
  try {
    const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${currentMint}`);
    const data = await res.json();
    const pairs = (data.pairs || []).filter(p => p.chainId === 'solana');
    if (!pairs.length) {
      document.getElementById('statusMsg').textContent = 'ペアが見つかりません';
      return;
    }

    const pair = pairs.sort((a, b) => parseFloat(b.liquidity?.usd || 0) - parseFloat(a.liquidity?.usd || 0))[0];
    const price = parseFloat(pair.priceUsd || 0);
    const chg5 = parseFloat(pair.priceChange?.m5 || 0);
    const liq = parseFloat(pair.liquidity?.usd || 0);
    const buys = pair.txns?.m5?.buys || 0;
    const sells = pair.txns?.m5?.sells || 0;
    const buyRatio = (buys + sells) > 0 ? (buys / (buys + sells) * 100).toFixed(1) : null;

    document.getElementById('statsRow').style.display = 'grid';
    document.getElementById('statPrice').textContent = formatPrice(price);
    const chgEl = document.getElementById('statChange5');
    chgEl.textContent = `${chg5 >= 0 ? '+' : ''}${chg5.toFixed(2)}%`;
    chgEl.className = `stat-value ${chg5 >= 0 ? 'up' : 'down'}`;
    document.getElementById('statLiq').textContent = `$${formatNum(liq)}`;
    document.getElementById('statBuyRatio').textContent = buyRatio ? `${buyRatio}%` : '—';

    document.getElementById('statusMsg').textContent = '';
    document.getElementById('updateLabel').textContent = `更新: ${new Date().toLocaleTimeString('ja-JP')}`;
    document.getElementById('liveDot').style.background = '#22c55e';

  } catch(e) {
    document.getElementById('statusMsg').textContent = 'エラー: ' + e.message;
  }
}

async function fetchOHLCV() {
  try {
    const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${currentMint}`);
    const data = await res.json();
    const pairs = (data.pairs || []).filter(p => p.chainId === 'solana');
    if (!pairs.length) return;
    const pair = pairs.sort((a, b) => parseFloat(b.liquidity?.usd || 0) - parseFloat(a.liquidity?.usd || 0))[0];
    const pairAddr = pair.pairAddress;

    const ohlcvRes = await fetch(`https://api.dexscreener.com/latest/dex/pairs/solana/${pairAddr}`);
    const ohlcvData2 = await ohlcvRes.json();

    // DexScreenerからローソク足を生成（過去30件の価格変動から近似）
    // 実際のOHLCVはDexScreenerではWebSocket経由が必要なので価格履歴で近似
    const currentPrice = parseFloat(pair.priceUsd || 0);
    const chg1h = parseFloat(pair.priceChange?.h1 || 0) / 100;
    const chg6h = parseFloat(pair.priceChange?.h6 || 0) / 100;
    const chg24h = parseFloat(pair.priceChange?.h24 || 0) / 100;

    // 簡易的な価格推移を生成
    generateSimpleChart(currentPrice, chg1h, chg6h, chg24h, pair);

  } catch(e) {
    console.error(e);
  }
}

function generateSimpleChart(price, chg1h, chg6h, chg24h, pair) {
  const points = 30;
  const prices = [];
  
  // 1時間前の価格を起点に線形補間で価格推移を生成
  const price1hAgo = price / (1 + chg1h);
  
  for (let i = 0; i < points; i++) {
    const t = i / (points - 1);
    // ノイズを加えた価格推移
    const noise = (Math.random() - 0.5) * 0.02;
    const basePrice = price1hAgo + (price - price1hAgo) * t;
    prices.push(basePrice * (1 + noise));
  }
  prices[prices.length - 1] = price; // 最後は現在価格

  drawChart(prices, pair);
  analyzeAndShowSignals(prices, price, pair);
  document.getElementById('chartContainer').style.display = 'block';
  document.getElementById('signalRow').style.display = 'grid';
  document.getElementById('updateTime').textContent = `最終更新: ${new Date().toLocaleTimeString('ja-JP')} (${currentTf}m足近似)`;
}

function drawChart(prices, pair) {
  const canvas = document.getElementById('priceChart');
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth;
  canvas.width = W * window.devicePixelRatio;
  canvas.height = 200 * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  const w = W, h = 200;

  const min = Math.min(...prices) * 0.998;
  const max = Math.max(...prices) * 1.002;
  const range = max - min;

  ctx.clearRect(0, 0, w, h);

  // グリッド
  ctx.strokeStyle = '#1e1e2e';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = (h - 20) * i / 4 + 10;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
    const val = max - range * i / 4;
    ctx.fillStyle = '#444';
    ctx.font = '10px SF Mono, monospace';
    ctx.fillText(formatPrice(val), 4, y - 2);
  }

  // 価格ライン
  const isUp = prices[prices.length-1] >= prices[0];
  const lineColor = isUp ? '#22c55e' : '#ef4444';

  // グラデーション塗り
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, isUp ? '#22c55e30' : '#ef444430');
  grad.addColorStop(1, '#00000000');

  ctx.beginPath();
  prices.forEach((p, i) => {
    const x = w * i / (prices.length - 1);
    const y = h - 20 - (p - min) / range * (h - 30) + 10;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.lineTo(w, h - 10);
  ctx.lineTo(0, h - 10);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  prices.forEach((p, i) => {
    const x = w * i / (prices.length - 1);
    const y = h - 20 - (p - min) / range * (h - 30) + 10;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 2;
  ctx.stroke();

  // 現在価格ライン
  const currentY = h - 20 - (prices[prices.length-1] - min) / range * (h - 30) + 10;
  ctx.beginPath();
  ctx.setLineDash([4, 4]);
  ctx.moveTo(0, currentY);
  ctx.lineTo(w, currentY);
  ctx.strokeStyle = lineColor + '60';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.setLineDash([]);
}

function analyzeAndShowSignals(prices, currentPrice, pair) {
  const n = prices.length;
  const ma5 = prices.slice(-5).reduce((a,b) => a+b, 0) / 5;
  const ma10 = prices.slice(-10).reduce((a,b) => a+b, 0) / 10;
  const ma20 = prices.reduce((a,b) => a+b, 0) / n;

  const chg5m = parseFloat(pair.priceChange?.m5 || 0);
  const chg1h = parseFloat(pair.priceChange?.h1 || 0);
  const buys = pair.txns?.m5?.buys || 0;
  const sells = pair.txns?.m5?.sells || 0;
  const buyRatio = (buys + sells) > 0 ? buys / (buys + sells) : 0.5;
  const liq = parseFloat(pair.liquidity?.usd || 0);

  // トレンド判定
  let trend, trendDesc;
  if (ma5 > ma10 && ma10 > ma20 && chg5m > 2) {
    trend = 'up';
    trendDesc = `短期MA全て上向き / 5m: +${chg5m.toFixed(1)}% / 買い優勢(${(buyRatio*100).toFixed(0)}%)`;
  } else if (ma5 < ma10 && chg5m < -2) {
    trend = 'down';
    trendDesc = `下落トレンド / 5m: ${chg5m.toFixed(1)}% / 売り圧力強い`;
  } else {
    trend = 'range';
    trendDesc = `レンジ相場 / 5m: ${chg5m >= 0 ? '+' : ''}${chg5m.toFixed(1)}% / 方向感なし`;
  }

  const badge = document.getElementById('trendBadge');
  badge.textContent = trend === 'up' ? '↑ 上昇トレンド' : trend === 'down' ? '↓ 下落トレンド' : '→ レンジ';
  badge.className = `trend-badge trend-${trend === 'up' ? 'up' : trend === 'down' ? 'down' : 'range'}`;
  document.getElementById('trendDesc').textContent = trendDesc;

  // エントリー目安
  const support = Math.min(...prices.slice(-10)) * 0.99;
  const resist = Math.max(...prices.slice(-10)) * 1.01;
  const entry = currentPrice * 0.97;
  const stop = currentPrice * 0.95;
  const target = currentPrice * 1.15;

  // 過熱スコア計算
  const s_chg5 = Math.min(100, Math.max(0, (chg5m + 10) / 20 * 100));
  const s_buy = Math.min(100, buyRatio * 100 * 1.4);
  const s_chg1h = Math.min(100, Math.max(0, (chg1h + 20) / 40 * 100));
  const heatScore = Math.round(s_chg5 * 0.4 + s_buy * 0.35 + s_chg1h * 0.25);

  let heatLabel, heatDesc, heatColor;
  if (heatScore >= 80) {
    heatLabel = '🔥 過熱'; heatColor = '#ef4444';
    heatDesc = '買われすぎの可能性。押し目待ちが有利。';
  } else if (heatScore >= 60) {
    heatLabel = '⚡ 加速中'; heatColor = '#f59e0b';
    heatDesc = '上昇モメンタムあり。エントリー検討可。';
  } else if (heatScore >= 40) {
    heatLabel = '📈 上昇傾向'; heatColor = '#22c55e';
    heatDesc = '緩やかな上昇。5m価格への指値が有効。';
  } else {
    heatLabel = '😴 低調'; heatColor = '#666';
    heatDesc = '動きが鈍い。様子見推奨。';
  }

  document.getElementById('heatCard').style.display = 'block';
  document.getElementById('heatScore').textContent = heatScore;
  document.getElementById('heatScore').style.color = heatColor;
  document.getElementById('heatLabel').textContent = heatLabel;
  document.getElementById('heatLabel').style.color = heatColor;
  document.getElementById('heatDesc').textContent = heatDesc;
  document.getElementById('heatGaugeFill').style.width = heatScore + '%';
  document.getElementById('heatGaugeFill').style.background = heatColor;

  const f1c = chg5m >= 5 ? '#22c55e' : chg5m >= 0 ? '#f59e0b' : '#ef4444';
  document.getElementById('hf1').style.width = s_chg5 + '%';
  document.getElementById('hf1').style.background = f1c;
  document.getElementById('hv1').textContent = `${chg5m >= 0 ? '+' : ''}${chg5m.toFixed(1)}%`;
  document.getElementById('hv1').style.color = f1c;

  const f2c = buyRatio >= 0.6 ? '#22c55e' : buyRatio >= 0.45 ? '#f59e0b' : '#ef4444';
  document.getElementById('hf2').style.width = s_buy + '%';
  document.getElementById('hf2').style.background = f2c;
  document.getElementById('hv2').textContent = `${(buyRatio*100).toFixed(0)}%`;
  document.getElementById('hv2').style.color = f2c;

  const f3c = chg1h >= 10 ? '#22c55e' : chg1h >= 0 ? '#f59e0b' : '#ef4444';
  document.getElementById('hf3').style.width = s_chg1h + '%';
  document.getElementById('hf3').style.background = f3c;
  document.getElementById('hv3').textContent = `${chg1h >= 0 ? '+' : ''}${chg1h.toFixed(1)}%`;
  document.getElementById('hv3').style.color = f3c;

  document.getElementById('entryList').innerHTML = `
    <div class="entry-item">
      <span class="entry-label">指値目安</span>
      <span class="entry-value buy">${formatPrice(entry)}</span>
    </div>
    <div class="entry-item">
      <span class="entry-label">サポート</span>
      <span class="entry-value">${formatPrice(support)}</span>
    </div>
    <div class="entry-item">
      <span class="entry-label">レジスタンス</span>
      <span class="entry-value">${formatPrice(resist)}</span>
    </div>
    <div class="entry-item">
      <span class="entry-label">ストップロス</span>
      <span class="entry-value sell">${formatPrice(stop)}</span>
    </div>
    <div class="entry-item">
      <span class="entry-label">利確目安</span>
      <span class="entry-value buy">${formatPrice(target)}</span>
    </div>
  `;
}

function formatPrice(p) {
  if (!p || p === 0) return '$0';
  if (p >= 0.01) return '$' + p.toFixed(4);
  const str = p.toFixed(20);
  const match = str.match(/^0\.(0+)([1-9]\d*)/);
  if (!match) return '$' + p.toExponential(2);
  const zeros = match[1].length;
  const sig = match[2].slice(0, 4);
  const sub = zeros.toString().split('').map(d => '₀₁₂₃₄₅₆₇₈₉'[d]).join('');
  return `$0.0${sub}${sig}`;
}

function formatNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n.toFixed(0);
}

document.getElementById('caInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadToken();
});
</script>
